name: Check attribution footer

# Fails when a pull-request body carries the harness attribution footer, which the
# `no-emoji-in-durable-records` rule forbids in pull-request and issue bodies. The harness tells
# authors to add it, so it arrives on pull request after pull request and is otherwise removed by
# hand at the gate. No other check can see a body: the no-emoji guard in `ci.yml` scans the
# filesystem, and a body is not on it. A squash merge turns the body into the commit message on
# `main`, so the body is what lands in history.
#
# All five trigger types are needed. A body can take on the footer when the pull request opens,
# which is where most specimens carried it, and through any later edit.
#
# The body is read from the API rather than from the event payload, so an edit that lands between
# the event and the run is still the text that is checked.
#
# A Dependabot body is generated from the upstream release notes, which can carry emoji nobody on
# this repository wrote and nobody can edit, so the body check is skipped for that author. The
# skip is inside the step, not a job-level `if`: a skipped required check stays pending, and a
# step that exits cleanly reports success.
#
# Adapted from the copy in UAMS-Web/uams-statamic.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

# Nothing at the workflow level; the one job states the scopes it needs.
permissions: {}

jobs:
  check:
    name: Attribution footer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check the body for the attribution footer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          author=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.user.login')
          if [ "$author" = "dependabot[bot]" ]; then
            echo "Skipped: the body of a Dependabot pull request is generated from upstream release notes."
            exit 0
          fi
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node scripts/check-attribution-footer.mjs "$RUNNER_TEMP/body.md"
